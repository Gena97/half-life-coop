// Настройки совместного прохождения оригинальной кампании
hostname "Half-Life Co-op"
// Режим сети выбирается при запуске и сохраняется между картами
mp_teamplay 0
mp_friendlyfire 1
mp_allowmonsters 1
mp_flashlight 1
mp_forcerespawn 1
mp_weaponstay 1
mp_falldamage 1
mp_timelimit 0
mp_fraglimit 0
// Хозяин сервера сохраняет и загружает всю кооперативную сессию
bind F6 "coop_save quick"
bind F7 "coop_load quick"
